<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retrieva — Recovery Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0d0d0d;
    color: #f0f0f0;
    margin: 0;
    padding: 40px;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: #a0a0a0;
    margin-bottom: 30px;
  }
  .stats-row {
    display: flex;
    gap: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }
  .stat-card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 20px 28px;
    min-width: 180px;
  }
  .stat-label {
    font-size: 13px;
    color: #a0a0a0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .stat-value {
    font-size: 32px;
    font-weight: 700;
    margin-top: 6px;
    color: #e8b84b;
  }
  .chart-container {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 24px;
    max-width: 900px;
    margin-bottom: 30px;
  }
  table {
    width: 100%;
    max-width: 900px;
    border-collapse: collapse;
    margin-top: 10px;
  }
  th, td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid #2a2a2a;
  }
  th {
    color: #a0a0a0;
    font-size: 13px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<h1>Retrieva</h1>
<div class="subtitle">Checkout failure detection &amp; recovery — Razorpay AI Buildathon 2026</div>

<div class="stats-row" id="statsRow"></div>

<div class="chart-container">
  <canvas id="recoveryChart" height="90"></canvas>
</div>

<div class="chart-container">
  <table id="causeTable">
    <thead>
      <tr><th>Cause</th><th>Total</th><th>Recovered</th><th>Recovery Rate</th><th>Amount Recovered (₹)</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
fetch('data.json')
  .then(res => res.json())
  .then(data => {
    // Stat cards
    const statsRow = document.getElementById('statsRow');
    statsRow.innerHTML = `
      <div class="stat-card">
        <div class="stat-label">Transactions Processed</div>
        <div class="stat-value">${data.total_transactions}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Amount At Risk</div>
        <div class="stat-value">₹${(data.total_amount_at_risk / 100000).toFixed(1)}L</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Amount Recovered</div>
        <div class="stat-value">₹${(data.total_amount_recovered / 100000).toFixed(1)}L</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Recovery Rate</div>
        <div class="stat-value">${data.overall_recovery_rate}%</div>
      </div>
    `;

    // Chart
    const labels = data.by_cause.map(c => c.cause);
    const rates = data.by_cause.map(c => c.recovery_rate);
    new Chart(document.getElementById('recoveryChart'), {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Recovery Rate (%)',
          data: rates,
          backgroundColor: '#e8b84b'
        }]
      },
      options: {
        scales: {
          y: { beginAtZero: true, max: 100, ticks: { color: '#a0a0a0' }, grid: { color: '#2a2a2a' } },
          x: { ticks: { color: '#a0a0a0' }, grid: { color: '#2a2a2a' } }
        },
        plugins: { legend: { labels: { color: '#f0f0f0' } } }
      }
    });

    // Table
    const tbody = document.querySelector('#causeTable tbody');
    data.by_cause.forEach(c => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${c.cause}</td>
        <td>${c.total}</td>
        <td>${c.recovered}</td>
        <td>${c.recovery_rate}%</td>
        <td>₹${c.amount_recovered.toLocaleString('en-IN')}</td>
      `;
      tbody.appendChild(row);
    });
  });
</script>

</body>
</html>
